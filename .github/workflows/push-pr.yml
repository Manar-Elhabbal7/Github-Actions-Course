name: on push
on:
  push:
    branches:
      - main
      - "releases/**"
    paths:
      - "src/**"

  pull_request:
    branches:
      - main
      - "releases/**"
    paths:
      - "src/**"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: run tests
        run: npm test